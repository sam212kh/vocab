# Include inside the HTTPS server block for the actual application hostname.
# The AI service binds to loopback only; nginx is the sole public entry point.
location ^~ /api/ai {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Evaluations can take a while on local models.
    proxy_read_timeout 120s;
}
